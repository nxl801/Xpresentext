name: Capture presenter workspace
on:
  push:
    branches: [docs/capture-presenter-window]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Open the published app with a sample talk
        run: |
          curl -fsSL https://github.com/nxl801/Xpresentext/releases/download/v0.6.4/Xpresentext-0.6.4-macOS-arm64-AppleSpeech.zip -o app.zip
          ditto -x -k app.zip .
          export DEVELOPER_DIR=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer
          xcrun --show-sdk-version
          find Textream/Textream -name '*.swift' -print0 | xargs -0 xcrun swiftc -parse-as-library -swift-version 5 -enable-bare-slash-regex -whole-module-optimization -target arm64-apple-macosx15.0 -D LOCAL_COMPANION -module-name Textream -o Xpresentext.app/Contents/MacOS/Xpresentext
          codesign --force --sign - Xpresentext.app
          python3 -m venv demo-env
          demo-env/bin/pip install -q python-pptx
          demo-env/bin/python - <<'PY'
          from pptx import Presentation
          from pptx.util import Inches, Pt
          from pptx.dml.color import RGBColor
          d = Presentation()
          d.slide_width, d.slide_height = Inches(13.333), Inches(7.5)
          for title, body, notes in [
            ("A quieter morning commute", "A three-week pilot", "Think about the last time you missed a connection. Today I will show you what changed when we moved one departure."),
            ("Five minutes made the difference", "Earlier departures at two stops", "We moved the first bus five minutes earlier. Riders had more time to make the next train. The timetable stayed the same for the rest of the day."),
            ("Where we go next", "Repeat the pilot on the north route", "Next month we will repeat the pilot on the north route. We will ask riders which connections still need work.")]:
              slide=d.slides.add_slide(d.slide_layouts[1])
              slide.shapes.title.text=title
              slide.placeholders[1].text=body
              fill=slide.background.fill
              fill.solid()
              fill.fore_color.rgb=RGBColor.from_string("173E48")
              for shape,size,color in [(slide.shapes.title,52,"FFFFFF"),(slide.placeholders[1],28,"87DCC1")]:
                  shape.left=Inches(.8)
                  shape.width=Inches(11.7)
                  shape.top=Inches(2.4 if size==52 else 4.0)
                  for paragraph in shape.text_frame.paragraphs:
                      for run in paragraph.runs:
                          run.font.size=Pt(size)
                          run.font.color.rgb=RGBColor.from_string(color)
              slide.notes_slide.notes_text_frame.text=notes
          d.save("Morning commute.pptx")
          PY
          if [ ! -x /Applications/LibreOffice.app/Contents/MacOS/soffice ]; then brew install --cask libreoffice; fi
          defaults write com.apple.universalaccess reduceTransparency -bool false
          open -a "$PWD/Xpresentext.app" "$PWD/Morning commute.pptx"
          sleep 35
          cat > /tmp/window.swift <<'SWIFT'
          import CoreGraphics
          let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly,.excludeDesktopElements], kCGNullWindowID) as? [[String:Any]] ?? []
          for w in windows where (w[kCGWindowOwnerName as String] as? String)?.lowercased() == "xpresentext" && w[kCGWindowLayer as String] as? Int == 0 {
              if let bounds = w[kCGWindowBounds as String] as? [String:Any], let width = bounds["Width"] as? Double, width > 600 {
                  print(w[kCGWindowNumber as String]!); break
              }
          }
          SWIFT
          wid=$(swift /tmp/window.swift)
          if [ -n "$wid" ]; then screencapture -x -o -l "$wid" presenter.png; else screencapture -x presenter.png; fi
      - uses: actions/upload-artifact@v4
        with:
          name: presenter-window
          path: presenter.png
          retention-days: 1
